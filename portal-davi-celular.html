<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f3f3">

  <title>Portal do Davi</title>

  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:#383838}body{background:#f3f3f3}.screen{position:relative;min-height:100dvh;overflow:hidden;isolation:isolate}.tree{position:absolute;z-index:-1;top:7%;left:14%;width:112%;height:96%;object-fit:fill;pointer-events:none}.content{position:absolute;left:5.2%;right:5.2%;bottom:6.3%;}.avatar{display:block;width:clamp(76px,19vw,144px);height:clamp(76px,19vw,144px);border-radius:50%;border:3px solid #5c984d;padding:3px;background:#f3f3f3;object-fit:cover;object-position:50% 33%}.greeting{margin:1.05rem 0 3.2rem;font-weight:300;line-height:1.08}.greeting .hello{display:block;font-size:clamp(25px,5.6vw,44px)}.greeting .name{display:block;font-size:clamp(43px,9vw,72px);margin-top:.35rem}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2.1%;margin-bottom:1.35rem}.card{min-height:clamp(76px,18vw,136px);padding:clamp(8px,2.7vw,22px);background:#fff;border:0;border-radius:6px;box-shadow:0 5px 9px #0003;text-align:left;color:#414141;display:flex;flex-direction:column;justify-content:center;gap:4px;font-size:clamp(10px,2.4vw,18px);line-height:1.17}.card svg{width:clamp(22px,5vw,38px);height:clamp(22px,5vw,38px);fill:#328a42}.card.security{background:#f8514b;color:#fff}.card.security svg{fill:none;stroke:#fff;stroke-width:2}.enter{width:100%;height:clamp(65px,15vw,112px);background:#3e8a45;border:0;border-radius:6px;box-shadow:0 5px 9px #0003;color:#fff;font-size:clamp(18px,3.6vw,29px);font-weight:700;text-align:left;padding:0 5.8%;letter-spacing:.02em}.card:focus-visible,.enter:focus-visible,.sheet-close:focus-visible{outline:3px solid #161616;outline-offset:3px}@media(max-height:680px){.content{position:relative;margin:30vh 5.2% 6%;left:auto;right:auto;bottom:auto}.tree{height:100%}.greeting{margin-bottom:2rem}}@media(min-width:740px){.screen{max-width:740px;margin:auto;box-shadow:0 0 24px #0002}}
    .sheet-backdrop{position:fixed;inset:0;background:#0009;z-index:5;opacity:0;visibility:hidden;transition:opacity .32s,visibility .32s}.sheet{position:fixed;z-index:6;left:50%;bottom:0;width:min(100%,740px);height:calc(100dvh - 5.5%);background:#fff;border-radius:32px 32px 0 0;transform:translate(-50%,105%);transition:transform .42s cubic-bezier(.2,.8,.2,1);overflow-y:auto;overscroll-behavior:contain;box-shadow:0 -8px 24px #0001}.sheet-open .sheet-backdrop{opacity:1;visibility:visible}.sheet-open .sheet{transform:translate(-50%,0)}.sheet-open{overflow:hidden}.sheet-close{display:block;margin:14px auto 0;width:60px;height:7px;border:0;border-radius:20px;background:#a2a2a2;cursor:pointer}.sheet-inner{padding:26px 7.5% max(36px,env(safe-area-inset-bottom));min-height:100%;display:flex;flex-direction:column;align-items:center}.sheet-title{margin:12px 0 24px;text-align:center;color:#999;font-size:clamp(19px,4.5vw,34px);font-weight:400}.qr{width:clamp(150px,39vw,270px);height:clamp(150px,39vw,270px);image-rendering:pixelated}.qr-number{font-size:clamp(18px,4.4vw,34px);font-weight:300;color:#666;margin:12px 0 0}.id-info{width:100%;margin-top:clamp(54px,12vh,145px)}.student-name{font-size:clamp(19px,4.4vw,34px);font-weight:700;text-align:center;margin:0 0 clamp(30px,5vh,56px);color:#202020}.id-row{display:grid;grid-template-columns:32% 1fr;gap:7%;align-items:start}.id-photo{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:center 29%;background:#fff}.id-data{font-size:clamp(13px,3.25vw,26px);color:#252525}.registration{font-size:clamp(21px,4.8vw,38px);line-height:1}.validity{font-weight:600;margin:3px 0 clamp(42px,8vh,85px);white-space:nowrap}.personal{display:grid;grid-template-columns:auto 1fr;column-gap:13px;line-height:1.25}.course{text-align:center;color:#1e4b29;margin:clamp(30px,6vh,66px) 0 8px;font-size:clamp(21px,5vw,40px);font-weight:700}.course small{display:block;font-size:.72em}.university-mark{width:clamp(95px,23vw,170px);height:auto;margin:auto}.demo-label{font-size:12px;letter-spacing:.08em;color:#777;text-align:center;margin:18px 0 0}@media(max-width:375px){.sheet-inner{padding-left:6%;padding-right:6%}.id-row{gap:5%}.id-data{font-size:12px}.validity{font-size:11px}}
    .card[href]{text-decoration:none}.sheet{visibility:hidden;pointer-events:none}.sheet:target{visibility:visible;pointer-events:auto;transform:translate(-50%,0)}.sheet:target+.sheet-backdrop{opacity:1;visibility:visible}
  </style>
